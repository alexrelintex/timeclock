version: 2
updates:
  # Workflow actions are pinned to full commit SHAs (a mutable tag can be repointed
  # by the action owner — a supply-chain risk). Dependabot keeps those pins current,
  # updating both the SHA and its `# vX.Y.Z` comment. One grouped PR per week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
