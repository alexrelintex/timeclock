name: Release

# Push a semver tag (e.g. v0.1.0) to build and publish the image to GHCR:
#   ghcr.io/alexrelintex/timeclock:0.1.0  (+ 0.1 and latest)
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write # required to push to GHCR with the built-in GITHUB_TOKEN

jobs:
  release:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
