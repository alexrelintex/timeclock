name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Domain smoke tests
        run: npm test
      - name: Scheduling / overtime / forecast tests
        run: npm run test:scheduling

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: timeclock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the built image
        run: |
          docker run -d --name tc-ci -p 8787:8787 \
            -e SEED_DEMO=true -e 'INSTANCE_NAME=CI' timeclock:ci
          # wait for the health endpoint to report ok
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8787/healthz | grep -q '"ok":true'; then
              echo "healthy"; docker rm -f tc-ci; exit 0
            fi
            sleep 2
          done
          echo "image failed health check"; docker logs tc-ci; docker rm -f tc-ci; exit 1
